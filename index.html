<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUMI & FRIENDS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HOME -->
  <section id="home" class="page active">
    <div class="hero-bg">

      <div class="home-buttons">
        <button id="applyBtn" class="main-btn">Apply WL</button>
        <button id="artBtn" class="main-btn">ART</button>
      </div>

    </div>
  </section>


  <!-- APPLY WL -->
  <section id="apply" class="page">
    <div class="dark-bg">

      <button class="hamburger" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="page-title">
        APPLY WHITELIST TO BECOME A FRIEND
      </div>

      <form id="whitelistForm" class="whitelist-form">

        <div class="task-row">
          <div class="task-name">Follow X</div>

          <a
            href="https://x.com/humifriends"
            target="_blank"
            rel="noopener noreferrer"
            class="task-link"
          >
            Do it
          </a>
        </div>


        <div class="task-row">
          <div class="task-name">Like &amp; RT Pinned Post</div>

          <a
            href="https://x.com/humifriends"
            target="_blank"
            rel="noopener noreferrer"
            class="task-link"
          >
            Do it
          </a>
        </div>


        <div class="task-row task-input-row">
          <div class="task-name">
            QT pinned post
          </div>

          <div class="task-content">
            <div class="task-instruction">
              “I will be friends with @humifriends”
            </div>

            <input
              type="text"
              id="quoteLink"
              name="quoteLink"
              placeholder="Drop link to post"
              autocomplete="off"
            >
          </div>
        </div>


        <div class="task-row task-input-row">
          <div class="task-name">
            Tag 3 friends in pinned post
          </div>

          <div class="task-content">
            <input
              type="text"
              id="tagLink"
              name="tagLink"
              placeholder="Drop link to post"
              autocomplete="off"
            >
          </div>
        </div>


        <div class="task-row task-input-row wallet-row">
          <div class="task-name">
            Submit Your EVM
          </div>

          <div class="task-content">
            <input
              type="text"
              id="wallet"
              name="wallet"
              placeholder="0x........"
              autocomplete="off"
              spellcheck="false"
            >
          </div>
        </div>


        <button
          type="submit"
          id="sendBtn"
          class="send-btn"
        >
          SEND
        </button>

      </form>

    </div>
  </section>


  <!-- ART -->
  <section id="art" class="page">
    <div class="dark-bg">

      <button class="hamburger" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="art-title">
        ART
      </div>

      <div class="art-grid">

        <div class="art-card">
          <img src="./assets/art-1.jpg" alt="Humi artwork 1">
        </div>

        <div class="art-card">
          <img src="./assets/art-2.jpg" alt="Humi artwork 2">
        </div>

        <div class="art-card">
          <img src="./assets/art-3.jpg" alt="Humi artwork 3">
        </div>

        <div class="art-card">
          <img src="./assets/art-4.jpg" alt="Humi artwork 4">
        </div>

        <div class="art-card">
          <img src="./assets/art-5.jpg" alt="Humi artwork 5">
        </div>

      </div>

    </div>
  </section>


  <!-- NAVIGATION -->
  <div id="navOverlay" class="nav-overlay hidden">

    <div class="nav-menu">

      <button id="navHome">HOME</button>
      <button id="navApply">APPLY WL</button>
      <button id="navArt">ART</button>

    </div>

  </div>


  <!-- SUCCESS POPUP -->
  <div id="successOverlay" class="success-overlay hidden">

    <div class="success-popup">

      <p>
        Your Application to become HUMI's friend is in the Queue.
      </p>

      <button id="closeSuccess">
        OK
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
