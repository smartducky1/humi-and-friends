<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUMI & FRIENDS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="app">

  <!-- ================= HOME ================= -->
  <section id="home" class="page home-page">
    <div class="hero-bg"></div>

    <h1 class="home-title">HUMI &amp; FRIENDS</h1>

    <div class="home-buttons">
      <button id="applyBtn" class="figma-button">Apply WL</button>
      <button id="artBtn" class="figma-button">ART</button>
    </div>
  </section>


  <!-- ================= APPLY WL ================= -->
  <section id="apply" class="page inner-page hidden">

    <div class="dark-bg"></div>

    <button id="menuApply" class="hamburger" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="apply-title">
      APPLY WHITELIST TO BECOME A FRIEND
    </div>

    <form id="applyForm" class="apply-card">

      <div class="task-row">
        <div class="task-label">
          Follow X
        </div>

        <a
          class="task-action"
          href="https://x.com/humifriends"
          target="_blank"
          rel="noopener"
        >
          Follow
        </a>
      </div>


      <div class="task-row">
        <div class="task-label">
          Like &amp; RT Pinned Post
        </div>

        <a
          class="task-action"
          href="https://x.com/humifriends"
          target="_blank"
          rel="noopener"
        >
          Do it
        </a>
      </div>


      <div class="task-row quote-row">

        <div class="task-label small-label">
          <strong>QT pinned post</strong>
          <span>“I will be friends with @humifriends”</span>
        </div>

        <input
          id="quoteLink"
          type="url"
          placeholder="Drop link to post"
        >

      </div>


      <div class="task-row">

        <div class="task-label">
          Tag 3 friends in pinned post
        </div>

        <input
          id="tagLink"
          type="url"
          placeholder="Drop link to post"
        >

      </div>


      <div class="task-row wallet-row">

        <div class="task-label">
          Submit Your EVM
        </div>

        <input
          id="wallet"
          type="text"
          placeholder="0x........"
          autocomplete="off"
        >

      </div>


      <button
        class="send-button"
        type="submit"
      >
        SEND
      </button>

    </form>

  </section>


  <!-- ================= ART ================= -->
  <section id="art" class="page inner-page hidden">

    <div class="dark-bg"></div>

    <button id="menuArt" class="hamburger" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="art-title">
      ART
    </div>

    <div class="art-grid">

      <div class="art-card">
        <img src="assets/art-01.png" alt="Humi artwork 1">
      </div>

      <div class="art-card">
        <img src="assets/art-02.png" alt="Humi artwork 2">
      </div>

      <div class="art-card">
        <img src="assets/art-03.png" alt="Humi artwork 3">
      </div>

      <div class="art-card">
        <img src="assets/art-04.png" alt="Humi artwork 4">
      </div>

      <div class="art-card">
        <img src="assets/art-05.png" alt="Humi artwork 5">
      </div>

    </div>

  </section>


  <!-- ================= NAVIGATION ================= -->
  <div id="navOverlay" class="nav-overlay hidden">

    <div class="nav-menu">

      <button data-page="home">
        HOME
      </button>

      <button data-page="apply">
        APPLY WL
      </button>

      <button data-page="art">
        ART
      </button>

    </div>

  </div>


  <!-- ================= SUCCESS POPUP ================= -->
  <div id="successOverlay" class="success-overlay hidden">

    <div class="success-popup">

      <p>
        Your Application to become HUMI's friend is in the Queue.
      </p>

      <button id="closeSuccess">
        OK
      </button>

    </div>

  </div>

</main>

<script src="script.js"></script>

</body>
</html>
