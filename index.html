<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUMI & FRIENDS</title>
  <meta name="description" content="HUMI & FRIENDS whitelist and art." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <!-- HOME -->
    <section class="page home-page active" id="home">
      <div class="scene"></div>
      <div class="home-content">
        <h1>HUMI &amp; FRIENDS</h1>
        <div class="home-actions">
          <button class="ui-button" data-page="apply">Apply WL</button>
          <button class="ui-button" data-page="art">ART</button>
        </div>
      </div>
    </section>

    <!-- APPLY WL -->
    <section class="page inner-page" id="apply">
      <div class="scene dimmed"></div>
      <button class="menu-button" id="applyMenu" aria-label="Open menu">☰</button>

      <div class="apply-wrap">
        <div class="apply-card">
          <div class="title-pill">APPLY WHITELIST TO BECOME A FRIEND</div>

          <form id="wlForm" novalidate>
            <div class="task-row">
              <span>Follow X</span>
              <a href="https://x.com/humifriends" target="_blank" rel="noopener">FOLLOW</a>
            </div>

            <div class="task-row">
              <span>Like &amp; RT Pinned Post</span>
              <a href="https://x.com/humifriends" target="_blank" rel="noopener">OPEN X</a>
            </div>

            <div class="task-row">
              <span>QT pinned post</span>
              <input id="quoteText" type="text" value="I will be friends with @humifriends" readonly />
            </div>

            <div class="task-row">
              <span>Tag 3 friends in pinned post</span>
              <input id="friends" type="text" placeholder="@friend1 @friend2 @friend3" />
            </div>

            <div class="task-row">
              <span>Submit Your EVM</span>
              <input id="wallet" type="text" placeholder="0x..." autocomplete="off" />
            </div>

            <button class="send-button" type="submit">SEND</button>
          </form>
        </div>
      </div>
    </section>

    <!-- ART -->
    <section class="page inner-page" id="art">
      <div class="scene dimmed"></div>
      <button class="menu-button" id="artMenu" aria-label="Open menu">☰</button>

      <div class="art-wrap">
        <div class="title-pill art-title">ART</div>
        <div class="art-grid">
          <div class="art-card"><img src="assets/art-1.jpg" alt="HUMI artwork 1"></div>
          <div class="art-card"><img src="assets/art-2.jpg" alt="HUMI artwork 2"></div>
          <div class="art-card"><img src="assets/art-3.jpg" alt="HUMI artwork 3"></div>
          <div class="art-card"><img src="assets/art-4.jpg" alt="HUMI artwork 4"></div>
          <div class="art-card"><img src="assets/art-5.jpg" alt="HUMI artwork 5"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- SUCCESS POPUP -->
  <div class="modal-backdrop" id="successModal" aria-hidden="true">
    <div class="success-modal" role="dialog" aria-modal="true">
      <p>Your Application to become HUMI's friend is in the Queue.</p>
      <button id="closeModal">OK</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
